services:
  kubo:
    image: ipfs/kubo:v0.43.1
    container_name: unibus-kubo
    restart: unless-stopped
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    environment:
      IPFS_PROFILE: server
      GOMAXPROCS: "2"
      GOMEMLIMIT: 850MiB
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - kubo-data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  kubo-data:
    name: unibus-kubo-data
