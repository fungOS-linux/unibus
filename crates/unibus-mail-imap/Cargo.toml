[package]
name = "unibus-mail-imap"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded IMAP owner adapter for the Unibus mail bridge"

[dependencies]
anyhow.workspace = true
async-imap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
mailparse = "0.18"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
tokio-rustls.workspace = true
unibus.workspace = true
unibus-credentials.workspace = true
unibus-mail.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
