[package]
name = "unibus-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
isochrone = { git = "https://github.com/ajmwagar/isochrone.git", rev = "361aa56a338e055543a0650cb346274e2c1e7dd5", optional = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2.workspace = true
unibus.workspace = true
stream-descriptors = { path = "../stream-descriptors" }

[dev-dependencies]
serde_json.workspace = true
isochrone-core = { git = "https://github.com/ajmwagar/isochrone.git", rev = "361aa56a338e055543a0650cb346274e2c1e7dd5" }

[features]
isochrone = ["dep:isochrone"]

[[bin]]
name = "unibus-isochrone"
path = "src/bin/unibus-isochrone.rs"
required-features = ["isochrone"]
