[package]
name = "unibus-router"
default-run = "unibus-router"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hub daemon for the household bus: registry, grants, and QoS-aware relay. Lifted from jarvis-router."

[features]
default = []
owner-catalog = ["dep:fpl-resource-observation", "dep:sha2"]
managed-gateway = ["dep:unibus-mycelium"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
getrandom = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unibus = { workspace = true }
unibus-quic = { workspace = true }
unibus-mycelium = { path = "../unibus-mycelium", optional = true }
fpl-resource-observation = { git = "https://github.com/ajmwagar/mycelium.git", rev = "83a8cf8a818c29db84845eba8128477f38ab39ca", optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true }

[dev-dependencies]
unibus-canvas = { path = "../unibus-canvas" }
tempfile = { workspace = true }
rcgen = "0.14"
