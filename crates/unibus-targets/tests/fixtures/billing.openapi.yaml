openapi: 3.1.0
info:
  title: Billing
  version: 1.0.0
paths:
  /v1/invoices:
    get:
      operationId: listInvoices
      responses:
        '200':
          description: invoice list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
    post:
      operationId: createInvoice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invoice'
      responses:
        '201':
          description: created
  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
    delete:
      operationId: deleteInvoice
      responses:
        '204':
          description: deleted
components:
  schemas:
    Invoice:
      type: object
    InvoiceList:
      type: array
