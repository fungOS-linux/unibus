[package]
name = "unibus-iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Credential-free Iroh relay catalogs over the Unibus discovery boundary"

[features]
default = []
transport = ["dep:iroh", "dep:tokio"]
fleet-identity = ["transport", "dep:mycelium-peer-protocol"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
unibus.workspace = true
url = "2"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"], optional = true }
tokio = { workspace = true, features = ["time", "net"], optional = true }
mycelium-peer-protocol = { git = "https://github.com/ajmwagar/mycelium.git", rev = "83a8cf8a818c29db84845eba8128477f38ab39ca", optional = true }

[dev-dependencies]
tempfile.workspace = true
ed25519-dalek = "2.2"
