[workspace]
members = ["crates/unibus", "crates/unibus-router"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
getrandom = "0.4"
tempfile = "3"
unibus = { path = "crates/unibus" }
