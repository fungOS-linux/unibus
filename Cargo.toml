[workspace]
members = ["crates/unibus", "crates/unibus-dcp", "crates/unibus-device", "crates/unibus-fix", "crates/unibus-input", "crates/unibus-mcp", "crates/unibus-media", "crates/unibus-midi", "crates/unibus-mqtt", "crates/unibus-mycelium", "crates/unibus-qemu", "crates/unibus-quic", "crates/unibus-recording", "crates/unibus-router", "crates/stream-descriptors", "crates/unibus-sdk", "crates/unibus-lua", "crates/unibus-ffi", "crates/unibus-adb", "crates/unibus-bambu", "crates/unibus-plugin", "crates/unibus-hdhomerun", "crates/unibus-services", "crates/unibus-ipfs", "crates/unibus-cast", "crates/unibus-iroh", "crates/unibus-canvas", "crates/unibus-targets"]
resolver = "2"
exclude = ["crates/unibus-holodeck"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
getrandom = "0.4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync"] }
tempfile = "3"
libloading = "0.8"
midir = "0.11"
sha2 = "0.10"
rumqttc = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
dcp = { git = "https://github.com/FuturePresentLabs/dcp.git", rev = "d3a1335" }
unibus = { path = "crates/unibus" }
unibus-quic = { path = "crates/unibus-quic" }
